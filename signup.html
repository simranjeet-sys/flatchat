<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · FlatChat</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <header class="auth__header">
        <div class="auth__logo" aria-hidden="true">FC</div>
        <h1>Create your account</h1>
        <p class="auth__subtitle">Join FlatChat in a few seconds</p>
      </header>

      <form id="signup-form" class="auth__form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
          <p class="field__error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field__error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field__password">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="field__toggle" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="field__error" id="password-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
          <p class="field__error" id="confirm-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="checkbox">
            <input type="checkbox" name="terms" id="terms" required>
            <span>I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a></span>
          </label>
          <p class="field__error" id="terms-error" aria-live="polite"></p>
        </div>

        <p class="form__error" id="form-error" role="alert"></p>

        <button type="submit" class="btn" id="submit-btn">Sign up</button>
      </form>

      <p class="auth__footer">
        Already have an account? <a href="login.html" class="link">Log in</a>
      </p>
    </div>
  </main>

  <script src="js/signup.js"></script>
</body>
</html>
