<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · FlatChat</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <header class="auth__header">
        <div class="auth__logo" aria-hidden="true">FC</div>
        <h1>Reset your password</h1>
        <p class="auth__subtitle">Enter your email and we'll send you a reset link</p>
      </header>

      <form id="reset-form" class="auth__form" action="/api/password-reset" method="post" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field__error" id="email-error" aria-live="polite"></p>
        </div>

        <p class="form__error" id="form-error" role="alert"></p>

        <button type="submit" class="btn btn--block" id="submit-btn">Send reset link</button>
      </form>

      <div class="reset-sent" id="reset-sent" hidden>
        <p class="auth__subtitle" role="status" id="reset-sent-message"></p>
        <button type="button" class="btn btn--secondary btn--block" id="resend-btn">Resend email</button>
        <p class="field__error" id="resend-status" aria-live="polite"></p>
      </div>

      <p class="auth__footer">
        Remembered it? <a href="login.html" class="link">Back to log in</a>
      </p>
    </div>
  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
